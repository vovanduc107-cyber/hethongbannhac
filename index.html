<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTBN - Kho Nhạc Độc Quyền</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0f19] text-gray-100 font-sans pb-32">
    <header class="sticky top-0 z-40 bg-[#0b0f19]/95 backdrop-blur border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-xl bg-cyan-500 flex items-center justify-center font-bold text-black text-xs">H</div>
                <span class="font-extrabold text-cyan-400">HTBN STORE</span>
            </div>
        </div>
    </header>
    <section class="max-w-7xl mx-auto px-4 pt-6 pb-4">
        <div class="rounded-3xl bg-gradient-to-r from-purple-900 to-indigo-900 p-6 text-center border border-gray-800">
            <h1 class="text-xl font-extrabold mb-2">Sở Hữu Beat Độc Quyền Bản Hit</h1>
            <p class="text-xs text-gray-300">Kho nhạc chất lượng cao dành cho nghệ sĩ và producer.</p>
        </div>
    </section>
    <section class="max-w-7xl mx-auto px-4 py-2">
        <h2 class="text-sm font-bold mb-3">Danh Sách Beat Nổi Bật</h2>
        <div class="space-y-3">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-3 flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-xs">Neon Nights (Prod. KAI)</h3>
                    <p class="text-[10px] text-gray-400">140 BPM • 700.000đ</p>
                </div>
                <button onclick="alert('Đã thêm vào giỏ hàng!')" class="bg-cyan-500 text-black px-3 py-1.5 rounded-xl text-xs font-bold">Mua</button>
            </div>
        </div>
    </section>
</body>
</html>
