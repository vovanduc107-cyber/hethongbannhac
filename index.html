<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTBN - Hệ Thống Bán Nhạc Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            background-color: #030712; 
            color: #f3f4f6; 
            font-family: system-ui, -apple-system, sans-serif; 
        }

        /* Tối ưu hiệu năng: Sử dụng hiệu ứng tĩnh, sang trọng, thay thế hoàn toàn viền LED nặng nề */
        .luxury-card {
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.85), rgba(11, 15, 25, 0.95));
            border: 1px solid rgba(234, 179, 8, 0.2);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            transition: all 0.3s ease;
        }

        .luxury-card:hover {
            border-color: rgba(234, 179, 8, 0.4);
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(234, 179, 8, 0.1);
            transform: translateY(-2px);
        }

        /* Tiêu đề gradient sang trọng */
        .luxury-heading {
            background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Ánh sáng nền chuyển động cực nhẹ, tối ưu hóa bằng GPU (will-change) */
        .ambient-glow {
            position: relative;
            overflow: hidden;
        }
        .ambient-glow::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(-30px, 30px, 0) scale(1.1); }
        }
        
        /* Hiệu ứng vẫy cờ Việt Nam mượt mà */
        @keyframes wave {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(14deg); }
            40% { transform: rotate(-8deg); }
            60% { transform: rotate(14deg); }
            80% { transform: rotate(-4deg); }
            100% { transform: rotate(0deg); }
        }
        .flag-anim {
            display: inline-block;
            animation: wave 2.5s infinite;
            transform-origin: 70% 70%;
        }

        /* Hạt ánh kim lấp lánh nhẹ nhàng */
        @keyframes floatParticle {
            0% { transform: translateY(0px) translateX(0px) scale(0.8); opacity: 0; }
            30% { opacity: 0.7; }
            100% { transform: translateY(-110vh) translateX(40px) scale(1.2); opacity: 0; }
        }
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(251,191,36,0.9) 0%, rgba(217,119,6,0.1) 60%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle linear infinite;
        }

        /* Logo hiệu ứng ánh kim độc quyền */
        .brand-logo {
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.3);
            transition: transform 0.3s ease;
        }
        .brand-logo:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.6);
        }

        /* Gấu hoạt hình nhẹ nhàng */
        @keyframes cuteJump {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            30% { transform: translateY(-12px) rotate(-6deg) scale(1.1); }
            50% { transform: translateY(0) rotate(0deg) scale(0.95); }
            70% { transform: translateY(-8px) rotate(6deg) scale(1.05); }
        }
        .dancing-bear {
            animation: cuteJump 2.2s ease-in-out infinite;
            display: inline-block;
            font-size: 1.5rem;
        }
        .dancing-bear-delay {
            animation: cuteJump 2.2s ease-in-out infinite;
            animation-delay: 1.1s;
            display: inline-block;
            font-size: 1.5rem;
        }
    </style>
</head>
<body class="min-h-screen pb-36 relative overflow-x-hidden">

    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-10 left-1/4 w-[30rem] h-[30rem] bg-amber-500/5 rounded-full blur-[140px]"></div>
        <div class="absolute bottom-10 right-1/4 w-[35rem] h-[35rem] bg-yellow-600/5 rounded-full blur-[160px]"></div>

        <div class="particle" style="width: 6px; height: 6px; left: 10%; bottom: -10px; animation-duration: 9s; animation-delay: 0s;"></div>
        <div class="particle" style="width: 4px; height: 4px; left: 30%; bottom: -10px; animation-duration: 12s; animation-delay: 2s;"></div>
        <div class="particle" style="width: 7px; height: 7px; left: 55%; bottom: -10px; animation-duration: 8s; animation-delay: 1s;"></div>
        <div class="particle" style="width: 5px; height: 5px; left: 80%; bottom: -10px; animation-duration: 10s; animation-delay: 3s;"></div>
    </div>

    <header class="flex justify-between items-center p-4 border-b border-amber-500/20 bg-[#0b0f19]/90 backdrop-blur-xl sticky top-0 z-50 shadow-md">
        <div class="flex items-center space-x-3">
            <img src="" alt="HTBN Logo" id="brand-logo-img" class="w-11 h-11 rounded-xl object-cover border border-amber-500/80 brand-logo">
            <div>
                <h1 class="font-extrabold text-lg leading-tight flex items-center gap-1.5 tracking-wide luxury-heading">
                    HTBN <span class="text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold tracking-normal shadow-sm">VIP LUXURY</span>
                </h1>
                <p class="text-[10px] text-amber-400/70 tracking-widest font-semibold uppercase">HỆ THỐNG BẢN QUYỀN NHẠC</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <div id="user-wallet" class="hidden items-center space-x-2 bg-gradient-to-r from-amber-500/15 to-yellow-600/15 border border-amber-500/40 px-3.5 py-1.5 rounded-xl shadow-inner">
                <span class="text-xs text-gray-300 hidden sm:inline">Ví:</span>
                <span id="wallet-balance" class="text-xs font-black text-amber-400">0 VNĐ</span>
                <button onclick="openDepositModal()" class="bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-black font-extrabold text-[10px] px-2.5 py-1 rounded-lg transition shadow-md">+ Nạp</button>
            </div>
            <div id="auth-header-action" class="flex items-center space-x-2"></div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-6 relative z-10">
        
        <section class="luxury-card ambient-glow p-5 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3 text-center sm:text-left">
                <div class="text-3xl flag-anim bg-red-600/20 p-2.5 rounded-2xl border border-red-500/40 shadow">🇻🇳</div>
                <div>
                    <h2 class="text-sm font-bold text-white flex items-center justify-center sm:justify-start gap-1.5">
                        Sảnh Âm Nhạc <span class="luxury-heading font-extrabold">Việt Nam</span>
                        <span class="dancing-bear ml-1">🧸</span>
                        <span class="dancing-bear-delay ml-1">🐼</span>
                    </h2>
                    <p class="text-[11px] text-amber-200/60 font-medium">Không gian giao dịch bản quyền track độc quyền đẳng cấp</p>
                </div>
            </div>
            <div class="bg-black/60 border border-amber-500/30 px-4 py-2 rounded-xl text-center shrink-0 shadow-inner">
                <p class="text-[9px] text-amber-400/70 uppercase tracking-widest font-bold">Giờ Việt Nam (GMT+7)</p>
                <p id="live-clock" class="text-sm font-mono font-bold text-amber-300">00:00:00</p>
            </div>
        </section>

        <section id="admin-section" class="luxury-card ambient-glow p-5 rounded-2xl space-y-4 hidden">
            <h2 class="luxury-heading font-bold text-base flex items-center gap-2">
                ☁️ Khu Vực Quản Trị - Đăng Tải Track Nhạc <span class="dancing-bear text-base">🐻</span>
            </h2>
            
            <div>
                <label class="block text-xs text-amber-200/80 mb-1 font-semibold">Tên Bài Hát</label>
                <input type="text" id="song-title" placeholder="Nhập tên track..." class="w-full bg-black/60 border border-amber-500/20 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs text-amber-200/80 mb-1 font-semibold">Nghệ Sĩ / Producer</label>
                <input type="text" id="song-artist" placeholder="Nhập tên nghệ sĩ..." class="w-full bg-black/60 border border-amber-500/20 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs text-amber-200/80 mb-1 font-semibold">Giá Tiền (VNĐ hoặc Miễn phí)</label>
                <input type="text" id="song-price" placeholder="Ví dụ: 500.000 hoặc Miễn phí" class="w-full bg-black/60 border border-amber-500/20 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400
