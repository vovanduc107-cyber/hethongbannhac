<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BearMelody - Thế Giới Âm Nhạc Gấu Hồng Đỏ</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 50%, #fecdd3 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary: #e11d48;
            --primary-gradient: linear-gradient(135deg, #fb7185, #e11d48, #9f1239);
            --text-main: #4c0519;
            --text-muted: #881337;
            --success: #059669;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng lấp lánh nền */
        .sparkle {
            position: fixed;
            background: radial-gradient(circle, #fff 0%, rgba(255,182,193,0.5) 70%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatSparkle 6s infinite ease-in-out;
            z-index: 0;
        }
        @keyframes floatSparkle {
            0%, 100% { transform: translateY(0) scale(0.8); opacity: 0.3; }
            50% { transform: translateY(-40px) scale(1.2); opacity: 0.8; }
        }

        /* Gấu cute nhảy nhót */
        .dancing-bears {
            position: fixed;
            bottom: 10px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
        }
        .bear {
            font-size: 2.5rem;
            animation: bounceBear 1.5s infinite alternate ease-in-out;
        }
        .bear:nth-child(2) { animation-delay: 0.3s; }
        .bear:nth-child(3) { animation-delay: 0.6s; }
        .bear:nth-child(4) { animation-delay: 0.9s; }
        @keyframes bounceBear {
            0% { transform: translateY(0) rotate(-5deg); }
            100% { transform: translateY(-25px) rotate(5deg); }
        }

        /* Cờ Việt Nam bay phấp phới */
        .vn-flag-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 6px 14px;
            border-radius: 30px;
            border: 2px solid #fda4af;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.15);
            animation: flagWave 3s infinite ease-in-out alternate;
        }
        @keyframes flagWave {
            0% { transform: rotate(-1deg); }
            100% { transform: rotate(1deg); }
        }
        .flag-icon {
            width: 24px;
            height: 16px;
            background-color: #da251d;
            position: relative;
            border-radius: 2px;
        }
        .flag-icon::after {
            content: "★";
            position: absolute;
            color: #ff0;
            font-size: 11px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Thanh Top Bar */
        .top-nav-bar {
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auth-btns { display: flex; gap: 8px; }

        .btn-auth-nav {
            background: white;
            border: 2px solid #fda4af;
            color: var(--primary);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.15);
            transition: 0.3s;
        }
        .btn-auth-nav:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .user-pill {
            display: none;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 6px 14px;
            border-radius: 30px;
            border: 2px solid #fda4af;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.15);
        }

        .admin-badge-nav {
            display: none;
            background: linear-gradient(135deg, #7c2d12, #991b1b);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(153, 27, 27, 0.3);
            transition: 0.3s;
        }
        .admin-badge-nav:hover { transform: scale(1.05); }

        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0 20px 0;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 700;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .user-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 25px;
            margin-top: 20px;
        }
        @media(max-width: 992px) { .user-grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--card-bg);
            border: 2px solid rgba(255, 182, 193, 0.8);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(225, 29, 72, 0.1);
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #ffe4e6;
            padding-bottom: 10px;
        }

        .wallet-box {
            background: linear-gradient(135deg, #ffe4e6, #fecdd3);
            border: 2px solid #fb7185;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .wallet-balance {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #9f1239;
            margin: 6px 0;
        }

        .form-group { margin-bottom: 15px; }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-input {
            width: 100%;
            background: white;
            border: 2px solid #fda4af;
            border-radius: 12px;
            padding: 12px 15px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
        }

        .file-upload-wrapper {
            position: relative;
            border: 2px dashed #fb7185;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            background: rgba(255, 241, 242, 0.6);
            cursor: pointer;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        .btn-main {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
            transition: 0.3s;
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(225, 29, 72, 0.4);
        }

        .info-box {
            background: rgba(255, 228, 230, 0.6);
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 0.85rem;
            margin-top: 15px;
        }
        .info-box p { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 700; }
        .info-box span.val { color: var(--primary); }

        .contact-box {
            background: linear-gradient(135deg, #fff1f2, #ffe4e6);
            border: 2px solid #fda4af;
            border-radius: 14px;
            padding: 15px;
            margin-top: 15px;
        }
        .contact-title {
            font-family: 'Outfit';
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .contact-item {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 620px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .music-card {
            background: white;
            border: 2px solid #ffe4e6;
            border-radius: 16px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.05);
            transition: 0.3s;
        }
        .music-card:hover {
            border-color: #fb7185;
            box-shadow: 0 6px 18px rgba(225, 29, 72, 0.12);
            transform: translateY(-2px);
        }

        .music-thumb { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; border: 2px solid #fda4af; }
        .music-info { flex: 1; }
        .music-info h4 { font-family: 'Outfit'; font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin-bottom: 3px; }
        .music-info p { font-size: 0.82rem; color: var(--text-muted); font-weight: 700; }

        .btn-audio-action {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-listen {
            background: #fdf2f8;
            border: 2px solid #f472b6;
            color: #db2777;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-listen:hover { background: #db2777; color: white; }

        .btn-buy {
            background: var(--primary-gradient);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(225, 29, 72, 0.2);
            transition: 0.3s;
        }
        .btn-buy:hover { transform: scale(1.05); }

        .admin-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        @media(max-width: 900px) { .admin-layout { grid-template-columns: 1fr; } }

        .bill-queue { display: flex; flex-direction: column; gap: 14px; max-height: 500px; overflow-y: auto; }
        .bill-card-item { background: white; border: 2px solid #fecdd3; border-radius: 14px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .admin-actions { display: flex; gap: 10px; margin-top: 10px; }

        .btn-approve { background: var(--success); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; flex: 1; }
        .btn-reject { background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; flex: 1; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(76, 5, 25, 0.4); backdrop-filter: blur(5px);
            z-index: 2000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: white; border-radius: 24px; width: 100%; max-width: 400px; padding: 30px;
            box-shadow: 0 20px 40px rgba(225, 29, 72, 0.2); position: relative; border: 2px solid #fda4af;
        }

        .modal-close {
            position: absolute; top: 18px; right: 18px; background: #ffe4e6; border: none;
            width: 32px; height: 32px; border-radius: 50%; color: var(--primary); cursor: pointer; font-weight: 700;
        }

        .toast {
            position: fixed; bottom: 30px; right: 30px; background: white; border: 2px solid #fb7185;
            color: var(--text-main); padding: 14px 22px; border-radius: 14px; z-index: 9999;
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.2); display: flex; align-items: center; gap: 12px;
            transform: translateY(100px); opacity: 0; transition: 0.4s; font-weight: 700;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="sparkleContainer"></div>
    <div class="dancing-bears">
        <span class="bear">🧸</span>
        <span class="bear">🐻‍❄️</span>
        <span class="bear">🐼</span>
        <span class="bear">🧸</span>
    </div>

    <div class="top-nav-bar">
        <div class="vn-flag-wrapper">
            <div class="flag-icon"></div>
            <span style="font-family:'Outfit'; font-size:11px; font-weight:900; color:#e11d48;">VIỆT NAM</span>
        </div>
        
        <div class="auth-btns" id="authButtonsContainer">
            <button class="btn-auth-nav" onclick="openModal('login')">Đăng Nhập</button>
            <button class="btn-auth-nav" onclick="openModal('register')" style="background: var(--primary-gradient); color:white; border:none;">Đăng Ký</button>
        </div>

        <div class="user-pill" id="userPillContainer">
            <i class="fa-solid fa-user-circle" style="color:var(--primary); font-size: 1.1rem;"></i>
            <span id="currentUsernameDisplay" style="font-weight:700; font-size:0.9rem;">Member</span>
            <button onclick="handleLogout()" style="background:transparent; border:none; color:var(--danger); cursor:pointer;"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>

        <button class="admin-badge-nav" id="adminNavBadge" onclick="switchView('admin')">
            <i class="
