<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Panel Pro - Dịch Vụ Mạng Xã Hội</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #1f1033 100%);
            --card-bg: rgba(17, 24, 39, 0.9);
            --primary: #ec4899;
            --primary-gradient: linear-gradient(135deg, #f43f5e, #ec4899, #8b5cf6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --border-color: rgba(236, 72, 153, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
        
        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 70px;
        }

        .wrapper { max-width: 600px; margin: 0 auto; }

        /* TOP BAR ĐĂNG NHẬP / ĐĂNG KÝ */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .user-welcome { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
        .user-welcome span { color: var(--primary); }
        
        .auth-btns-group { display: flex; gap: 8px; }
        .btn-auth {
            background: rgba(236, 72, 153, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-auth.primary { background: var(--primary-gradient); color: white; border: none; }

        header { text-align: center; margin-bottom: 25px; }
        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p { color: var(--text-muted); font-size: 0.82rem; font-weight: 600; margin-top: 4px; }

        .panel {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .panel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #f43f5e;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid rgba(236, 72, 153, 0.2);
            padding-bottom: 8px;
        }

        .wallet-box {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.12), rgba(139, 92, 246, 0.12));
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }
        .wallet-balance {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #f43f5e;
            margin: 5px 0;
        }

        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 0.83rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
        
        .form-select, .form-input {
            width: 100%;
            background: #090d16;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }
        .form-select:focus, .form-input:focus { border-color: var(--primary); }

        .service-info-badge {
            background: rgba(16, 185, 129, 0.1);
            border: 1px dashed var(--success);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.78rem;
            color: #34d399;
            font-weight: 700;
            margin-top: 6px;
        }

        .btn-main {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        /* MODAL ĐĂNG NHẬP / ĐĂNG KÝ */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: #111827; border: 2px solid var(--primary); border-radius: 20px;
            width: 90%; max-width: 360px; padding: 24px; position: relative;
        }
        .modal-close {
            position: absolute; top: 15px; right: 15px; background: rgba(236,72,153,0.2); border: none;
            width: 28px; height: 28px; border-radius: 50%; color: var(--primary); cursor: pointer; font-weight: 700;
        }

        .toast {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            max-width: 380px; margin: 0 auto; background: #1e293b;
            border: 2px solid var(--primary); color: var(--text-main);
            padding: 14px; border-radius: 14px; z-index: 2000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px;
            font-weight: 700; font-size: 0.9rem; transform: translateY(120px); opacity: 0; transition: 0.3s;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="top-bar">
            <div class="user-welcome" id="userWelcomeText">Xin chào, <span id="displayUsername">Khách</span></div>
            <div class="auth-btns-group" id="authButtonsGroup">
                <button class="btn-auth" onclick="openAuthModal('login')">Đăng Nhập</button>
                <button class="btn-auth primary" onclick="openAuthModal('register')">Đăng Ký</button>
            </div>
        </div>

        <header>
            <h1>SMM Panel Pro 🚀</h1>
            <p>Hệ thống tự động tăng Like, Follow, Share mạng xã hội</p>
        </header>

        <div class="panel">
            <div class="panel-title"><i class="fa-solid fa-wallet"></i> Quản Lý Số Dư</div>
            <div class="wallet-box">
                <div style="font-size:0.85rem; font-weight:800; color:var(--text-muted);">Số dư tài khoản</div>
                <div class="wallet-balance" id="accountBalance">50,000 đ</div>
                <div style="font-size:0.8rem; font-weight:700; color:var(--text-muted);">Trạng thái: <span style="color:#10b981;">Hoạt động ổn định</span></div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title"><i class="fa-solid fa-cart-shopping
