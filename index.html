<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTBN - Hệ Thống Bán Nhạc</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#111827',
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-100 min-h-screen font-sans selection:bg-blue-600 selection:text-white">

    <!-- Header / Navbar -->
    <header class="border-b border-gray-800 bg-darkBg/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-500/30">
                    H
                </div>
                <div>
                    <h1 class="font-extrabold tracking-wider text-lg leading-tight">HTBN</h1>
                    <p class="text-[10px] text-gray-400 uppercase tracking-widest">Hệ Thống Bán Nhạc</p>
                </div>
            </div>

            <!-- Auth Area -->
            <div id="auth-container">
                <!-- Chưa đăng nhập -->
                <div id="auth-buttons" class="flex items-center space-x-2">
                    <button onclick="openAuthModal('login')" class="px-4 py-2 text-sm font-semibold text-gray-300 hover:text-white transition">Đăng Nhập</button>
                    <button onclick="openAuthModal('signup')" class="px-4 py-2 text-sm font-semibold bg-blue-600 hover:bg-blue-500 rounded-xl transition shadow-lg shadow-blue-600/20">Đăng Ký</button>
                </div>
                <!-- Đã đăng nhập -->
                <div id="user-info" class="hidden items-center space-x-3">
                    <span id="user-email-display" class="text-xs text-blue-400 font-bold hidden sm:inline-block"></span>
                    <button onclick="logout()" class="px-3.5 py-2 text-xs font-bold bg-red-500/10 text-red-500 hover:bg-red-500/20 border border-red-500/20 rounded-xl transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Đăng Xuất</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 mt-6 space-y-8 pb-16">
        <!-- Banner -->
        <div class="relative rounded-3xl bg-gradient-to-r from-blue-900/60 via-purple-900/50 to-indigo-900/60 p-8 md:p-12 border border-blue-500/20 overflow-hidden shadow-2xl">
            <div class="relative z-10 space-y-3 max-w-xl">
                <span class="text-xs font-bold uppercase tracking-widest text-cyan-400 bg-cyan-950/80 px-3 py-1 rounded-full border border-cyan-500/30">HTBN – Hệ Thống Bán Nhạc</span>
                <h2 class="text-2xl sm:text-4xl font-extrabold text-white tracking-wide leading-tight">MUA TRACK NHẠC CHẤT LƯỢNG CAO</h2>
                <p class="text-gray-300 text-sm">Kho nhạc độc quyền dành cho DJ, producer, ca sĩ và những người yêu âm nhạc.</p>
            </div>
        </div>

        <!-- Tiêu đề Kho Nhạc & Nút Đăng Nhạc (Chỉ hiện với Admin) -->
        <div class="flex items-center justify-between">
            <h3 class="text-xl font-extrabold text-white flex items-center space-x-2">
                <i class="fa-solid fa-music text-blue-500"></i>
                <span>Kho Nhạc Độc Quyền</span>
            </h3>
            <button id="btn-toggle-upload" onclick="toggleUploadForm()" class="hidden items-center space-x-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition shadow-lg shadow-blue-600/25">
                <i class="fa-solid fa-plus"></i>
                <span>Đăng Nhạc Mới</span>
            </button>
        </div>

        <!-- Form Đăng Nhạc (Ẩn mặc định) -->
        <div id="upload-section" class="hidden bg-cardBg border border-blue-500/40 rounded-3xl p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <h3 class="text-lg font-extrabold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-cloud-arrow-up text-blue-500"></i>
                    <span>Đăng Tải Bài Hát Mới Lên Kho</span>
                </h3>
                <button onclick="toggleUploadForm()" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Tên bài hát</label>
                    <input type="text" id="song-title" placeholder="VD: Nhạc Dance Cuốn..." class="w-full bg-darkBg border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Ca sĩ / Producer</label>
                    <input type="text" id="song-artist" placeholder="VD: DJ Nam..." class="w-full bg-darkBg border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Giá tiền (VNĐ)</label>
                    <input type="number" id="song-price" placeholder="VD: 50000" class="w-full bg-darkBg border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>
            
            <div>
                <label class="text-xs text-gray-400 mb-1 block">Chọn file nhạc (MP3, WAV, FLAC...)</label>
                <input type="file" id="song-file" accept=".mp3,.wav,.flac,.m4a,audio/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600/20 file:text-blue-400 hover:file:bg-blue-600/30">
            </div>

            <p id="upload-msg" class="text-xs text-center text-red-400 h-4"></p>
            
            <button onclick="uploadSong()" id="upload-btn" class="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white shadow-lg shadow-blue-600/30 transition">
                Xác Nhận Đăng Bài
            </button>
        </div>

        <!-- Danh sách bài hát -->
        <div id="songs-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <p class="text-gray-500 text-sm italic col-span-full">Đang tải danh sách bài hát...</p>
        </div>
    </main>

    <!-- Modal Đăng Nhập / Đăng Ký / Quên Mật Khẩu -->
    <div id="auth-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-gray-800 rounded-3xl w-full max-w-md p-6 relative shadow-2xl space-y-5">
            <button onclick="closeAuthModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 id="modal-title" class="text-xl font-extrabold text-white text-center">Đăng Nhập Tài Khoản</h3>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Email của bạn</label>
                    <input type="email" id="auth-email" placeholder="name@example.com" class="w-full bg-darkBg border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div id="password-field-container">
                    <label class="text-xs text-gray-400 mb-1 block">Mật khẩu</label>
                    <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-darkBg border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <!-- Nút Quên mật khẩu & Chuyển đổi tab -->
            <div class="flex items-center justify-between text-xs">
                <button type="button" id="forgot-pass-link" onclick="switchToForgotMode()" class="text-blue-400 hover:underline">Quên mật khẩu?</button>
                <button type="button" id="switch-mode-btn" onclick="toggleAuthMode()" class="text-gray-400 hover:text-white transition">Chưa có tài khoản? Đăng ký</button>
            </div>

            <p id="auth-msg" class="text-xs text-center text-red-400 h-4"></p>

            <button onclick="handleAuthSubmit()" id="auth-submit-btn" class="w-full py-3 rounded-xl font-bold bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/30 transition">
                Đăng Nhập
            </button>
        </div>
    </div>

    <!-- Script Xử Lý -->
    <script>
        const SUPABASE_URL = 'https://znunswdfeylrmunntmhk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpudW5zd2RmZXlscm11bm50bWhrIiwicm9sZSI6ImFub24iLCJpYXQiOjM2MzMyODczNTl9.W54V_aY34eCgV3aO0Tq2_XzZ1K6k3_qV8Y9m4_8p2_o';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Email Quản Trị Viên của anh (để hiện nút đăng nhạc)
        const ADMIN_EMAIL = 'vovanduc107@gmail.com';

        let currentMode = 'login'; // 'login', 'signup', 'forgot'

        document.addEventListener('DOMContentLoaded', () => {
            checkUserSession();
            fetchSongs();
        });

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                document.getElementById('auth-buttons').classList.add('hidden');
                const userInfo = document.getElementById('user-info');
                userInfo.classList.remove('hidden');
                userInfo.classList.add('flex');
                document.getElementById('user-email-display').innerText = session.user.email;

                // Nếu đúng email của anh thì hiện nút đăng nhạc
                if (session.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    document.getElementById('btn-toggle-upload').classList.remove('hidden');
                    document.getElementById('btn-toggle-upload').classList.add('flex');
                }
            }
        }

        function openAuthModal(mode) {
            currentMode = mode;
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('auth-email').value = '';
            document.getElementById('auth-password').value = '';
            document.getElementById('auth-msg').innerText = '';
            updateModalUI();
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        function toggleAuthMode() {
            if (currentMode === 'login' || currentMode === 'forgot') {
                currentMode = 'signup';
            } else {
                currentMode = 'login';
            }
            updateModalUI();
        }

        function switchToForgotMode() {
            currentMode = 'forgot';
            updateModalUI();
        }

        function updateModalUI() {
            const titleEl = document.getElementById('modal-title');
            const submitBtn = document.getElementById('auth-submit-btn');
            const passContainer = document.getElementById('password-field-container');
            const switchBtn = document.getElementById('switch-mode-btn');
            const forgotLink = document.getElementById('forgot-pass-link');

            if (currentMode === 'login') {
                titleEl.innerText = 'Đăng Nhập Tài Khoản';
                submitBtn.innerText = 'Đăng Nhập';
                passContainer.style.display = 'block';
                switchBtn.innerText = 'Chưa có tài khoản? Đăng ký';
                forgotLink.style.display = 'block';
            } else if (currentMode === 'signup') {
                titleEl.innerText = 'Đăng Ký Tài Khoản Mới';
                submitBtn.innerText = 'Đăng Ký';
                passContainer.style.display = 'block';
                switchBtn.innerText = 'Đã có tài khoản? Đăng nhập';
                forgotLink.style.display = 'none';
            } else if (currentMode === 'forgot') {
                titleEl.innerText = 'Khôi Phục Mật Khẩu';
                submitBtn.innerText = 'Gửi Link Đổi Mật Khẩu';
                passContainer.style.display = 'none';
                switchBtn.innerText = 'Quay lại đăng nhập';
                forgotLink.style.display = 'none';
            }
            document.getElementById('auth-msg').innerText = '';
        }

        async function handleAuthSubmit() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const msgEl = document.getElementById('auth-msg');
            const submitBtn = document.getElementById('auth-submit-btn');

            if (!email) {
                msgEl.innerText = 'Vui lòng nhập email!';
                return;
            }

            submitBtn.disabled = true;

            if (currentMode === 'login') {
                msgEl.innerText = 'Đang đăng nhập...';
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    msgEl.innerText = 'Lỗi: ' + error.message;
                    submitBtn.disabled = false;
                } else {
                    location.reload();
                }
            } else if (currentMode === 'signup') {
                msgEl.innerText = 'Đang đăng ký tài khoản...';
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    msgEl.innerText = 'Lỗi: ' + error.message;
                    submitBtn.disabled = false;
                } else {
                    alert('Đăng ký thành công! Bạn đã có thể đăng nhập.');
                    currentMode = 'login';
                    updateModalUI();
                    submitBtn.disabled = false;
                }
            } else if (currentMode === 'forgot') {
                msgEl.innerText = 'Đang gửi link khôi phục...';
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.href,
                });
                if (error) {
                    msgEl.innerText = 'Lỗi: ' + error.message;
                    submitBtn.disabled = false;
                } else {
                    alert('Đã gửi email khôi phục mật khẩu! Vui lòng kiểm tra hộp thư của bạn.');
                    closeAuthModal();
                    submitBtn.disabled = false;
                }
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function toggleUploadForm() {
            const section = document.getElementById('upload-section');
            section.classList.toggle('hidden');
        }

        async function uploadSong() {
            const title = document.getElementById('song-title').value.trim();
            const artist = document.getElementById('song-artist').value.trim();
            const price = document.getElementById('song-price').value.trim();
            const fileInput = document.getElementById('song-file');
            const msgEl = document.getElementById('upload-msg');
            const btnEl = document.getElementById('upload-btn');

            if (!title || !artist || !price || fileInput.files.length === 0) {
                msgEl.innerText = 'Vui lòng điền đầy đủ thông tin và chọn file nhạc!';
                return;
            }

            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;

            btnEl.disabled = true;
            msgEl.innerText = 'Đang tải file lên hệ thống...';

            const { data: uploadData, error: uploadError } = await supabaseClient.storage
                .from('songs')
                .upload(fileName, file);

            if (uploadError) {
                msgEl.innerText = 'Lỗi upload file: ' + uploadError.message;
                btnEl.disabled = false;
                return;
            }

            const { data: { publicUrl } } = supabaseClient.storage
                .from('songs')
                .getPublicUrl(fileName);

            const { error: dbError } = await supabaseClient
                .from('songs')
                .insert([{ title, artist, price: Number(price), file_url: publicUrl }]);

            if (dbError) {
                msgEl.innerText = 'Lỗi lưu database: ' + dbError.message;
                btnEl.disabled = false;
            } else {
                alert('Đăng bài hát thành công!');
                location.reload();
            }
        }

        async function fetchSongs() {
            const container = document.getElementById('songs-container');
            const { data: songs, error } = await supabaseClient
                .from('songs')
                .select('*')
                .order('created_at', { ascending: false });

            if (error || !songs || songs.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm italic col-span-full">Chưa có bài nhạc nào được đăng tải.</p>';
                return;
            }

            container.innerHTML = songs.map(song => `
                <div class="bg-cardBg border border-gray-800 rounded-2xl p-4 flex flex-col justify-between space-y-3 shadow-lg">
                    <div>
                        <h4 class="font-bold text-white text-base truncate">${song.title}</h4>
                        <p class="text-xs text-gray-400 mt-0.5 truncate">${song.artist}</p>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-gray-800">
                        <span class="text-emerald-400 font-extrabold text-sm">${Number(song.price).toLocaleString('vi-VN')} đ</span>
                        <a href="${song.file_url}" target="_blank" class="px-3 py-1.5 bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 text-xs font-semibold rounded-xl transition flex items-center space-x-1">
                            <i class="fa-solid fa-download"></i>
                            <span>Tải về</span>
                        </a>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
