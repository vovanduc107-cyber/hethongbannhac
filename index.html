<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTBN - Hệ Thống Bán Nhạc</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0b0f19; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Header -->
    <header class="flex justify-between items-center p-4 border-b border-gray-800 bg-[#111827]/80 backdrop-blur sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="bg-blue-600 p-2 rounded-lg text-white font-bold">🎵</div>
            <div>
                <h1 class="font-bold text-lg leading-tight">HTBN</h1>
                <p class="text-xs text-gray-400">HỆ THỐNG BÁN NHẠC</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <span id="user-email" class="text-xs text-gray-300 hidden md:inline"></span>
            <button onclick="handleLogout()" class="bg-red-600/20 text-red-400 border border-red-600/30 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-red-600/30 transition">Đăng Xuất</button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-6">
        <!-- Form Quản Trị Đăng Tải -->
        <section class="bg-[#161f31] border border-gray-800 p-5 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-blue-400 font-bold text-base flex items-center gap-2">
                ☁️ Trang Quản Trị - Đăng Tải Track Nhạc Mới
            </h2>
            
            <div>
                <label class="block text-xs text-gray-400 mb-1">Tên Bài Hát</label>
                <input type="text" id="song-title" placeholder="Nhập tên track..." class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Nghệ Sĩ / Producer</label>
                <input type="text" id="song-artist" placeholder="Nhập tên nghệ sĩ..." class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Giá Tiền (VNĐ hoặc Miễn phí)</label>
                <input type="text" id="song-price" placeholder="Ví dụ: 600.000 hoặc Miễn phí" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Chọn File Âm Thanh</label>
                <input type="file" id="song-file" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
            </div>

            <button onclick="uploadSong()" id="upload-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20 text-sm">
                📤 Tải Lên Hệ Thống
            </button>
            <p id="upload-status" class="text-xs text-center font-medium"></p>
        </section>

        <!-- Kho Nhạc -->
        <section class="space-y-3">
            <h2 class="text-blue-400 font-bold text-base flex items-center gap-2">
                🎵 Kho Nhạc Độc Quyền & Mới Nhất
            </h2>
            <div id="songs-list" class="space-y-3">
                <p class="text-xs text-gray-500 italic">Đang tải danh sách bài hát...</p>
            </div>
        </section>
    </main>

    <!-- Thanh Player Cố Định Dưới Đáy -->
    <footer class="fixed bottom-0 left-0 right-0 bg-[#111827]/95 backdrop-blur border-t border-gray-800 p-3 z-50">
        <div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center space-x-3 overflow-hidden">
                <div class="w-10 h-10 bg-blue-600/20 border border-blue-500/30 rounded-xl flex items-center justify-center text-blue-400 shrink-0">🎵</div>
                <div class="truncate">
                    <p id="player-title" class="text-xs font-bold truncate text-gray-200">Chưa chọn bài hát</p>
                    <p id="player-artist" class="text-[10px] text-gray-400 truncate">HTBN Music Player</p>
                </div>
            </div>

            <div class="flex flex-col items-center flex-1 max-w-xs">
                <div class="flex items-center space-x-4 mb-1">
                    <button onclick="togglePlay()" id="play-pause-btn" class="w-9 h-9 bg-white text-black rounded-full flex items-center justify-center font-bold hover:scale-105 transition">▶</button>
                </div>
                <div class="w-full flex items-center space-x-2 text-[10px] text-gray-400">
                    <span id="current-time">00:00</span>
                    <input type="range" id="progress-bar" value="0" max="100" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                    <span id="total-time">00:00</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Audio Element Ẩn -->
    <audio id="audio-element" crossorigin="anonymous"></audio>

    <!-- Modal Thanh Toán QR Ngân Hàng -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-[#161f31] border border-gray-800 rounded-2xl p-5 max-w-sm w-full space-y-4 text-center">
            <h3 class="font-bold text-base text-white">Quét Mã QR Thanh Toán</h3>
            <p id="modal-song-info" class="text-xs text-gray-400"></p>
            
            <div class="bg-white p-3 rounded-xl inline-block mx-auto">
                <img id="qr-code-img" src="" alt="QR Code" class="w-48 h-48 mx-auto object-contain">
            </div>

            <div class="text-xs text-gray-300 bg-[#0b0f19] p-3 rounded-xl text-left space-y-1">
                <p>🏦 Ngân hàng: <b class="text-blue-400">Techcombank</b></p>
                <p>👤 Chủ tài khoản: <b class="text-blue-400">VO VAN DUC</b></p>
                <p>📝 Nội dung: <b id="qr-note" class="text-yellow-400">HTBN MUA</b></p>
            </div>

            <button onclick="closeCheckoutModal()" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2.5 rounded-xl text-xs transition">Đóng lại</button>
        </div>
    </div>

    <!-- Script Xử Lý -->
    <script>
        const SUPABASE_URL = 'https://qhtowcnxcvrwysvxjifr.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodG93Y254Y3Zyd3lzdnhqaWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMDczODgsImV4cCI6MjEwMzU4MzM4OH0.ddsqOqJ9YqGLCqq6Fe3bp4zUoHWySDNbVIBtsowBuBQ';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const BANK_ID = "TCB";
        const ACCOUNT_NO = "1903xxxxxxxxx";
        const ACCOUNT_NAME = "VO VAN DUC";

        const audioElement = document.getElementById('audio-element');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');

        let isUserSeeking = false;

        document.addEventListener("DOMContentLoaded", fetchSongs);

        async function fetchSongs() {
            const listContainer = document.getElementById('songs-list');
            const { data, error } = await supabaseClient
                .from('songs')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                listContainer.innerHTML = `<p class="text-xs text-red-400">Lỗi tải danh sách: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-gray-500 italic">Chưa có bài hát nào trên hệ thống.</p>`;
                return;
            }

            listContainer.innerHTML = data.map(song => `
                <div class="bg-[#161f31] border border-gray-800 p-3 rounded-xl flex items-center justify-between gap-3">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <button onclick="playSong('${song.file_url}', '${song.title}', '${song.artist}')" class="w-10 h-10 bg-blue-600 hover:bg-blue-500 text-white rounded-xl flex items-center justify-center shrink-0 shadow transition">▶</button>
                        <div class="truncate">
                            <h3 class="text-sm font-bold text-gray-100 truncate">${song.title}</h3>
                            <p class="text-xs text-gray-400 truncate">${song.artist}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <span class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/20">${song.price}</span>
                        <button onclick="openCheckout('${song.id}', '${song.title}', '${song.price}')" class="bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 border border-blue-600/30 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Mua ngay</button>
                    </div>
                </div>
            `).join('');
        }

        async function uploadSong() {
            const title = document.getElementById('song-title').value.trim();
            const artist = document.getElementById('song-artist').value.trim();
            const price = document.getElementById('song-price').value.trim();
            const fileInput = document.getElementById('song-file');
            const statusEl = document.getElementById('upload-status');

            if (!title || !artist || !price || fileInput.files.length === 0) {
                statusEl.className = "text-xs text-center font-medium text-red-400";
                statusEl.textContent = "Vui lòng điền đủ thông tin và chọn file nhạc!";
                return;
            }

            const file = fileInput.files[0];
            const fileName = `song_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

            statusEl.className = "text-xs text-center font-medium text-yellow-400";
            statusEl.textContent = "Đang tải file lên hệ thống...";

            try {
                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('songs')
                    .upload(fileName, file, { upsert: true });

                if (uploadError) throw new Error("Lỗi Storage: " + uploadError.message);

                const { data: publicURLData } = supabaseClient.storage
                    .from('songs')
                    .getPublicUrl(fileName);

                const fileUrl = publicURLData.publicUrl;

                const { error: insertError } = await supabaseClient
                    .from('songs')
                    .insert([{ title, artist, price, file_url: fileUrl }]);

                if (insertError) throw new Error("Lỗi Database: " + insertError.message);

                statusEl.className = "text-xs text-center font-medium text-emerald-400";
                statusEl.textContent = "Tải lên thành công!";
                
                document.getElementById('song-title').value = '';
                document.getElementById('song-artist').value = '';
                document.getElementById('song-price').value = '';
                fileInput.value = '';
                fetchSongs();

            } catch (err) {
                statusEl.className = "text-xs text-center font-medium text-red-400";
                statusEl.textContent = err.message;
            }
        }

        function playSong(url, title, artist) {
            document.getElementById('player-title').textContent = title;
            document.getElementById('player-artist').textContent = artist;
            totalTimeEl.textContent = "Đang tải...";
            currentTimeEl.textContent = "00:00";
            progressBar.value = 0;

            audioElement.src = url;
            audioElement.load();
            
            audioElement.play().then(() => {
                playPauseBtn.textContent = "⏸";
            }).catch(e => {
                console.log("Play blocked:", e);
                playPauseBtn.textContent = "▶";
            });
        }

        function togglePlay() {
            if (!audioElement.src) return;
            if (audioElement.paused) {
                audioElement.play();
                playPauseBtn.textContent = "⏸";
            } else {
                audioElement.audioElement?.pause() || audioElement.pause();
                playPauseBtn.textContent = "▶";
            }
        }

        // Bắt sự kiện cập nhật thời gian từ audio element
        audioElement.addEventListener('loadedmetadata', updateDuration);
        audioElement.addEventListener('durationchange', updateDuration);
        audioElement.addEventListener('canplay', updateDuration);

        function updateDuration() {
            if (audioElement.duration && !isNaN(audioElement.duration) && audioElement.duration !== Infinity) {
                totalTimeEl.textContent = formatTime(audioElement.duration);
            }
        }

        audioElement.addEventListener('timeupdate', () => {
            updateDuration();
            if (!isUserSeeking && audioElement.duration && !isNaN(audioElement.duration) && audioElement.duration !== Infinity) {
                const percent = (audioElement.currentTime / audioElement.duration) * 100;
                progressBar.value = percent;
                currentTimeEl.textContent = formatTime(audioElement.currentTime);
            }
        });

        // Xử lý tua nhạc mượt mà trên di động
        progressBar.addEventListener('mousedown', () => { isUserSeeking = true; });
        progressBar.addEventListener('touchstart', () => { isUserSeeking = true; });

        progressBar.addEventListener('input', () => {
            if (audioElement.duration && !isNaN(audioElement.duration)) {
                const time = (progressBar.value / 100) * audioElement.duration;
                currentTimeEl.textContent = formatTime(time);
            }
        });

        progressBar.addEventListener('change', () => {
            isUserSeeking = false;
            if (audioElement.duration && !isNaN(audioElement.duration)) {
                audioElement.currentTime = (progressBar.value / 100) * audioElement.duration;
            }
        });

        audioElement.addEventListener('ended', () => {
            playPauseBtn.textContent = "▶";
            progressBar.value = 0;
            currentTimeEl.textContent = "00:00";
        });

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return "00:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function openCheckout(id, title, price) {
            const modal = document.getElementById('checkout-modal');
            document.getElementById('modal-song-info').textContent = `Bài: ${title} - Giá: ${price}`;
            const cleanPrice = price.replace(/[^0-9]/g, '');
            const addInfo = `HTBN MUA ${id}`;
            document.getElementById('qr-note').textContent = addInfo;

            const qrImg = document.getElementById('qr-code-img');
            if (cleanPrice) {
                qrImg.src = `https://img.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-compact2.png?amount=${cleanPrice}&addInfo=${encodeURIComponent(addInfo)}&accountName=${encodeURIComponent(ACCOUNT_NAME)}`;
            } else {
                qrImg.src = `https://img.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-compact2.png?addInfo=${encodeURIComponent(addInfo)}&accountName=${encodeURIComponent(ACCOUNT_NAME)}`;
            }
            modal.classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        function handleLogout() {
            alert("Đã đăng xuất!");
            location.reload();
        }
    </script>
</body>
</html>
