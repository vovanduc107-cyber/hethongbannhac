<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BearMelody - Kho Nhạc Độc Quyền Gấu Hồng</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 50%, #fecdd3 100%);
            --card-bg: rgba(255, 255, 255, 0.94);
            --primary: #e11d48;
            --primary-gradient: linear-gradient(135deg, #fb7185, #e11d48, #9f1239);
            --text-main: #4c0519;
            --text-muted: #881337;
            --success: #059669;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 60px;
        }

        .sparkle {
            position: fixed;
            background: radial-gradient(circle, #fff 0%, rgba(255,182,193,0.5) 70%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .dancing-bears {
            position: fixed;
            bottom: 10px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
        }
        .bear { font-size: 2.2rem; }

        .top-nav-bar {
            position: fixed;
            top: 12px;
            right: 15px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vn-flag-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 5px 12px;
            border-radius: 30px;
            border: 2px solid #fda4af;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.15);
        }
        .flag-icon {
            width: 20px;
            height: 14px;
            background-color: #da251d;
            position: relative;
            border-radius: 2px;
        }
        .flag-icon::after {
            content: "★";
            position: absolute;
            color: #ff0;
            font-size: 9px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        .auth-btns { display: flex; gap: 6px; }

        .btn-auth-nav {
            background: white;
            border: 2px solid #fda4af;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.15);
        }

        .user-pill {
            display: none;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 5px 12px;
            border-radius: 30px;
            border: 2px solid #fda4af;
        }

        .admin-badge-nav {
            display: none;
            background: linear-gradient(135deg, #7c2d12, #991b1b);
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }

        header {
            text-align: center;
            padding: 45px 0 20px 0;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.3rem;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .user-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            margin-top: 15px;
        }
        @media(max-width: 900px) { .user-grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--card-bg);
            border: 2px solid rgba(255, 182, 193, 0.8);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(225, 29, 72, 0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 15px;
        }

        .panel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #ffe4e6;
            padding-bottom: 8px;
        }

        .wallet-box {
            background: linear-gradient(135deg, #ffe4e6, #fecdd3);
            border: 2px solid #fb7185;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 15px;
        }

        .wallet-balance {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #9f1239;
            margin: 4px 0;
        }

        .form-group { margin-bottom: 12px; }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-input {
            width: 100%;
            background: white;
            border: 2px solid #fda4af;
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 0.9rem;
        }
        .form-input:focus { outline: none; border-color: var(--primary); }

        .file-upload-wrapper {
            position: relative;
            border: 2px dashed #fb7185;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            background: rgba(255, 241, 242, 0.6);
            cursor: pointer;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        .btn-main {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
        }

        .info-box {
            background: rgba(255, 228, 230, 0.6);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.82rem;
            margin-top: 12px;
        }
        .info-box p { display: flex; justify-content: space-between; margin-bottom: 4px; font-weight: 700; }
        .info-box span.val { color: var(--primary); }

        .contact-box {
            background: linear-gradient(135deg, #fff1f2, #ffe4e6);
            border: 2px solid #fda4af;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
        }
        .contact-title {
            font-family: 'Outfit';
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .contact-item {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .music-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 550px;
            overflow-y: auto;
        }

        .music-card {
            background: white;
            border: 2px solid #ffe4e6;
            border-radius: 14px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .music-thumb { width: 55px; height: 55px; border-radius: 10px; object-fit: cover; border: 2px solid #fda4af; }
        .music-info { flex: 1; }
