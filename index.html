<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Panel Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
        body { background: #090d16; color: #f8fafc; min-height: 100vh; padding: 15px; padding-bottom: 50px; }
        .wrap { max-width: 500px; margin: 0 auto; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; background: #111827; border: 1px solid rgba(236,72,153,0.3); padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; }
        .btn-act { background: rgba(236,72,153,0.2); border: 1px solid #ec4899; color: #ec4899; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-act.pri { background: #ec4899; color: #fff; border: none; }
        
        .box { background: #111827; border: 2px solid rgba(236,72,153,0.25); border-radius: 16px; padding: 16px; margin-bottom: 15px; }
        .title { font-family: 'Outfit'; font-size: 1.05rem; font-weight: 700; color: #f43f5e; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(236,72,153,0.2); padding-bottom: 6px; }
        
        .fg { margin-bottom: 12px; }
        .fl { display: block; font-size: 0.8rem; font-weight: 700; color: #94a3b8; margin-bottom: 4px; }
        .fi, .fs { width: 100%; background: #090d16; border: 2px solid rgba(236,72,153,0.3); border-radius: 10px; padding: 10px; color: #fff; font-size: 0.9rem; outline: none; }
        .fi:focus, .fs:focus { border-color: #ec4899; }
        
        .btn-sub { width: 100%; background: linear-gradient(135deg, #f43f5e, #ec4899); color: white; font-weight: 700; border: none; border-radius: 10px; padding: 12px; font-size: 0.95rem; cursor: pointer; }

        /* KHUNG CHỨA FORM ĐĂNG NHẬP / ĐĂNG KÝ TRỰC TIẾP */
        .auth-card { display: none; }
        .auth-card.active { display: block; }
    </style>
</head>
<body>

    <div class="wrap">
        <div class="top-nav">
            <div style="font-size:0.85rem; color:#94a3b8;">Chào, <span id="lblUser" style="color:#ec4899; font-weight:700;">Khách</span></div>
            <div style="display:flex; gap:6px;">
                <a href="#auth-section" class="btn-act" onclick="switchTab('login')">Đăng Nhập</a>
                <a href="#auth-section" class="btn-act pri" onclick="switchTab('reg')">Đăng Ký</a>
            </div>
        </div>

        <div style="text-align:center; margin-bottom:20px;">
            <h1 style="font-family:'Outfit'; font-size:1.8rem; background:linear-gradient(135deg,#f43f5e,#ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">SMM Panel Pro 🚀</h1>
            <p style="font-size:0.75rem; color:#94a3b8; font-weight:600;">Hệ thống tăng tương tác tự động</p>
        </div>

        <div class="box" id="auth-section">
            <div id="formLogin" class="auth-card active">
                <div class="title"><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập Tài Khoản</div>
                <div class="fg">
                    <label class="fl">Tên tài khoản</label>
                    <input type="text" class="fi" id="logU" placeholder="Nhập username...">
                </div>
                <div class="fg">
                    <label class="fl">Mật khẩu</label>
                    <input type="password" class="fi" id="logP" placeholder="Nhập mật khẩu...">
                </div>
                <button class="btn-sub" onclick="doLogin()">Xác Nhận Đăng Nhập</button>
            </div>

            <div id="formReg" class="auth-card">
                <div class="title"><i class="fa-solid fa-user-plus"></i> Đăng Ký Tài Khoản Mới</div>
                <div class="fg">
                    <label class="fl">Tên tài khoản mới</label>
                    <input type="text" class="fi" id="regU" placeholder="Chọn username...">
                </div>
                <div class="fg">
                    <label class="fl">Mật khẩu</label>
                    <input type="password" class="fi" id="regP" placeholder="Tạo mật khẩu...">
                </div>
                <button class="btn-sub" onclick="doReg()">Đăng Ký (Nhận Ngay 50.000đ)</button>
            </div>
        </div>

        <div class="box" style="text-align:center;">
            <div style="font-size:0.75rem; color:#94a3b8; font-weight:700;">SỐ DƯ TÀI KHOẢN</div>
            <div style="font-family:'Outfit'; font-size:1.6rem; font-weight:900; color:#f43f5e; margin:5px 0;" id="lblBal">50,000 đ</div>
        </div>

        <div class="box">
            <div class="title"><i class="fa-solid fa-cart-shopping"></i> Tạo Đơn Dịch Vụ</div>
            <form onsubmit="makeOrder(event)">
                <div class="fg">
                    <label class="fl">Mạng xã hội</label>
                    <select class="fs" id="selPlat" onchange="changeSvc()">
                        <option value="fb">Facebook (Like/Follow)</option>
                        <option value="tk">TikTok (Follow/Tim)</option>
                    </select>
                </div>
                <div class="fg">
                    <label class="fl">Gói dịch vụ (Server)</label>
                    <select class="fs" id="selSvc" onchange="calc()">
                        <option value="50">Like Facebook Thường - 50đ/lượt</option>
                        <option value="100">Like Facebook VIP - 100đ/lượt</option>
                    </select>
                </div>
                <div class="fg">
                    <label class="fl">Link bài viết / Profile</label>
                    <input type="url" class="fi" id="inLink" placeholder="https://..." required>
                </div>
                <div class="fg">
                    <label class="fl">Số lượng (Tối thiểu 100)</label>
                    <input type="number" class="fi" id="inQty" value="100" min="100" oninput="calc()" required>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; background:#090d16; padding:10px; border-radius:8px; margin-bottom:12px;">
                    <span style="font-size:0.8rem; color:#94a3b8;">Tổng tiền:</span>
                    <span style="font-family:'Outfit'; font-size:1.1rem; font-weight:900; color:#10b981;" id="lblTotal">5,000 đ</span>
                </div>
                <button type="submit" class="btn-sub">Thanh Toán Ngay</button>
            </form>
        </div>
    </div>

    <script>
        let balance = 50000;

        function switchTab(type) {
            const loginCard = document.getElementById('formLogin');
            const regCard = document.getElementById('formReg');
            
            if(type === 'login') {
                loginCard.classList.add('active');
                regCard.classList.remove('active');
            } else {
                loginCard.classList.remove('active');
                regCard.classList.add('active');
            }
        }

        function doLogin() {
            let u = document.getElementById('logU').value.trim();
            if(!u) {
                alert('Vui lòng nhập tên tài khoản!');
                return;
            }
            document.getElementById('lblUser').innerText = u;
            alert('Đăng nhập thành công tài khoản: ' + u);
        }

        function doReg() {
            let u = document.getElementById('regU').value.trim();
            if(!u) {
                alert('Vui lòng nhập tên tài khoản!');
                return;
            }
            document.getElementById('lblUser').innerText = u;
            balance = 50000;
            document.getElementById('lblBal').innerText = balance.toLocaleString() + ' đ';
            alert('Đăng ký thành công! Đã tặng 50,000đ vào ví.');
        }

        function changeSvc() {
            let p = document.getElementById('selPlat').value;
            let s = document.getElementById('selSvc');
            if(p === 'fb') {
                s.innerHTML = `<option value="50">Like Facebook Thường - 50đ/lượt</option><option value="100">Like Facebook VIP - 100đ/lượt</option>`;
            } else {
                s.innerHTML = `<option value="120">Follow TikTok - 120đ/lượt</option><option value="40">Tim TikTok - 40đ/lượt</
